<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1615">
<title>Rutina Calistenia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: pestañas arriba (Hoy, Fases, Calentar y cerrar, Test, Registro). Cada ejercicio es una fila con series tocables y técnica animada. Barra de descanso fija abajo. */
:root{
  --paper:#eef2f0;--card:#ffffff;--card2:#e4ebe8;--ink:#12201e;--muted-solid:#586965;--line:#cdd6d2;
  --accent:#d4470c;--accent-ink:#ffffff;--good:#1d7a4b;--p1:#2f6f9f;--p2:#d4470c;--p3:#1d7a4b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1615;--card:#16221f;--card2:#1e2e2b;--ink:#e7efec;--muted-solid:#93a6a1;--line:#2b3d39;
    --accent:#ff8a4c;--accent-ink:#1a0d05;--good:#4cc38a;--p1:#6ab0e0;--p2:#ff8a4c;--p3:#4cc38a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1615;--card:#16221f;--card2:#1e2e2b;--ink:#e7efec;--muted-solid:#93a6a1;--line:#2b3d39;
  --accent:#ff8a4c;--accent-ink:#1a0d05;--good:#4cc38a;--p1:#6ab0e0;--p2:#ff8a4c;--p3:#4cc38a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding-bottom:40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
h1{font-size:2.3rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.8rem;font-weight:700}
h3{font-size:1.25rem;font-weight:700}
h4{font-family:var(--display);font-size:1.05rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-solid);margin:0 0 6px}
.kicker{margin:0 0 4px;font-size:.95rem;color:var(--accent);font-weight:600;letter-spacing:.04em}
.sub{margin:4px 0 0;color:var(--muted-solid)}
.note{border:1px solid var(--accent);border-left-width:6px;border-radius:10px;background:var(--card);padding:10px 14px;font-size:.95rem;margin:12px 0}
.note strong{color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.phasebar{display:flex;gap:6px}
.phasebar i{flex:1;height:8px;border-radius:4px;background:var(--card2)}
.phasebar i.on{background:var(--c)}
.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-weight:600;font-size:.9rem;color:#fff;background:var(--c)}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:10px;border-radius:5px;background:var(--card2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .25s}
.prog span{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
ul.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ex{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exm{margin:2px 0 0;color:var(--muted-solid);font-size:.95rem}
.exw{margin:0;font-size:.9rem;color:var(--accent);font-weight:600}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{min-height:48px;min-width:112px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:600 1rem var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.set.running{border-color:var(--accent);color:var(--accent)}
.set.done{background:var(--good);border-color:var(--good);color:#fff}
.set.done::before{content:"✓ "}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem var(--body);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tech{display:grid;grid-template-columns:1fr;gap:14px;border-top:1px solid var(--line);padding-top:12px}
.tech[hidden]{display:none}
@media (min-width:700px){.tech{grid-template-columns:minmax(240px,300px) 1fr}}
.figure{display:flex;flex-direction:column;gap:8px}
svg#fig{width:100%;height:auto;max-height:340px;background:var(--card2);border-radius:12px;display:block}
.seg{stroke-width:8;stroke-linecap:round;fill:none}
.torso,.leg{stroke:var(--ink)}
.arm{stroke:var(--accent)}
.head{fill:var(--card);stroke:var(--ink);stroke-width:6}
.ghost{opacity:.16}
.head.ghost{fill:none}
.floor{stroke:var(--muted-solid);stroke-width:3}
.bar2{stroke:var(--muted-solid);stroke-width:7;stroke-linecap:round}
.wallr{fill:var(--line)}
.lbl{fill:var(--muted-solid);font:600 13px var(--body)}
.figbar{display:flex;align-items:center;gap:12px;min-height:44px}
#phase{font-family:var(--display);font-size:1.25rem;font-weight:600}
.tinfo{display:flex;flex-direction:column;gap:10px;min-width:0}
ol,ul.plain{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:4px}
.pr{background:var(--card2);border-radius:10px;padding:8px 12px;font-size:.95rem}
.pr p{margin:0}
.pain{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pains{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:46px;padding:0 10px;border-radius:22px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:600 1rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.suggest{border-color:var(--accent);color:var(--accent)}
.checks{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.checks label{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent)}
.checks b{font-weight:600}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log .d{font-weight:600}
.warnp{color:var(--accent);font-weight:600}
.phcard{border-left:6px solid var(--c);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.phcard.now{background:var(--card2);border-radius:0 10px 10px 0;padding:10px 12px}
label.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px}
input[type=date],input[type=number]{min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:500 1rem var(--body);padding:0 10px}
input[type=number]{width:96px}
input[type=checkbox].sw{width:24px;height:24px;accent-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted-solid);font-size:.9rem}
td.v{font-weight:600}
.testgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.testgrid label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.95rem}

.sess{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.grp{margin:0;text-align:center;font-weight:600;color:var(--muted-solid);letter-spacing:.04em}
.big{position:relative;width:min(78vw,300px);aspect-ratio:1;border-radius:50%;border:0;background:var(--card2);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;margin:4px auto;cursor:pointer;font-family:var(--display);padding:0}
.big svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.big .bgc{fill:none;stroke:var(--line);stroke-width:8}
.big .fgc{fill:none;stroke:var(--c);stroke-width:8;stroke-linecap:round;stroke-dasharray:565.5;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear}
.big.work{--c:var(--accent)}
.big.rest{--c:var(--p1)}
.big.idle{--c:var(--good)}
.bl{font-size:1.5rem;font-weight:700;letter-spacing:.08em;color:var(--c)}
.bn{font-size:4.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bs{font:500 .9rem var(--body);color:var(--muted-solid);max-width:68%;text-align:center}
.big:disabled{cursor:default}
.big:not(:disabled):active{background:var(--line)}
.cur{text-align:center}
.cur h3{font-size:1.6rem}
.cur p{margin:2px 0 0;color:var(--muted-solid)}
.cur p.nx{font-size:.95rem}
details.snd summary,details.all summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.steplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steplist li{display:flex;justify-content:space-between;gap:10px;padding:6px 8px;border-radius:8px;font-size:.95rem}
.steplist li.now{background:var(--card2);font-weight:600}
.steplist li.ok{color:var(--good)}
.steplist li.gh{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-solid);padding-top:10px}
select,input[type=range]{min-height:44px;font:500 1rem var(--body);color:var(--ink)}
select{border-radius:8px;border:1.5px solid var(--line);background:var(--paper);padding:0 10px}
input[type=range]{accent-color:var(--accent);width:180px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---- Pantallas a pantalla completa, sin scroll en la sesión ---- */
html,body{height:100%;margin:0}
body{padding-bottom:0;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.screen{flex:1;min-height:0;overflow-y:auto;padding:16px}
.screen.fixed{overflow:hidden;display:flex;flex-direction:column}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;min-height:56px;border:0;background:none;color:var(--muted-solid);font:600 1.05rem var(--body);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.app.insess .tabs{display:none}
.ses{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ic{min-width:48px;min-height:48px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 1.1rem var(--body);cursor:pointer}
.lab{flex:1;text-align:center;font-weight:600;color:var(--muted-solid);line-height:1.2}
.prg{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;flex:none}
.prg i{display:block;height:100%;background:var(--good);width:0}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.mid h2{font-size:2rem}
.mid .ln{margin:0;color:var(--muted-solid);font-size:1.05rem}
.mid .ln2{margin:0;color:var(--muted-solid);font-size:.95rem}
.mid .warnx{margin:0;color:var(--accent);font-weight:600;font-size:.95rem}
.banner{margin:0;font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.bot{flex:none;display:flex;gap:10px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.bot .btn{flex:1;min-height:60px;font-size:1.2rem;border-radius:14px}
.big{width:min(70vw,38dvh);margin:0 auto}
.bn{font-size:min(4.4rem,13dvh)}
.figbox svg.fsvg{width:auto;height:min(36dvh,290px);max-width:100%;background:var(--card2);border-radius:12px;display:block;margin:0 auto}
.figure svg.fsvg{width:100%;height:auto;max-height:320px;background:var(--card2);border-radius:12px;display:block}
.fph{font-family:var(--display);font-size:1.25rem;font-weight:600}
.cuel{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:1.15rem}
.home{display:flex;flex-direction:column;gap:14px}
.home h1{font-size:2.6rem}
.cta{min-height:68px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font:700 1.4rem var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;width:100%}
.link{min-height:44px;border:0;background:none;color:var(--accent);font:600 1rem var(--body);cursor:pointer;text-decoration:underline}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column}
.sheet[hidden]{display:none}
.sheet .sh{display:flex;justify-content:flex-end;padding:12px 16px 0;flex:none}
.sheet .sb{flex:1;min-height:0;overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menugrid .btn{min-height:56px}
.adj{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--muted-solid);font-size:.95rem}.adj b{font:700 1.8rem var(--display);color:var(--ink);min-width:2ch;text-align:center}
.page{display:flex;flex-direction:column;gap:14px}
.page h1{font-size:2.2rem}
.tabs button:focus-visible,.ic:focus-visible,.cta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

  <main id="stage" class="screen"></main>

</div>

    if(pi.ph===1){if(L.type==='time')t+=5*pi.cyc;else if(id==='squatP'||id==='leg'||id==='ahang')t+=pi.cyc;}

var NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
var SEG=[['S','H','torso'],['H','K','leg'],['K','A','leg'],['A','F','leg'],['S','E','arm'],['E','W','arm']];
function buildBody(parent,ghost){
  var els={segs:[],head:null};
  SEG.forEach(function(s){els.segs.push({a:s[0],b:s[1],el:mk('line',{'class':'seg '+s[2]+(ghost?' ghost':'')},parent)});});
  els.head=mk('circle',{r:11,'class':'head'+(ghost?' ghost':'')},parent);

}
function setBody(els,p){
  els.segs.forEach(function(s){var a=p[s.a],b=p[s.b];s.el.setAttribute('x1',a[0]);s.el.setAttribute('y1',a[1]);s.el.setAttribute('x2',b[0]);s.el.setAttribute('y2',b[1]);});
  els.head.setAttribute('cx',p.head[0]);els.head.setAttribute('cy',p.head[1]);
}
function lerpPose(A,B,k){var o={};for(var key in A){var a=A[key],b=B[key]||a;o[key]=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];}return o;}
function ease(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function phaseOf(t,mode){
  if(mode==='hold')return {k:.5-.5*Math.cos(t*2*Math.PI),seg:0};
  if(mode==='neg'){
    if(t<.6)return {k:ease(t/.6),seg:1};
    if(t<.7)return {k:1,seg:2};
    if(t<.85)return {k:1-ease((t-.7)/.15),seg:3};
    return {k:0,seg:0};
  }
  if(t<.4)return {k:ease(t/.4),seg:1};
  if(t<.5)return {k:1,seg:2};
  if(t<.9)return {k:1-ease((t-.5)/.4),seg:3};
  return {k:0,seg:0};
}
var anim={raf:0,playing:false,cfg:null,body:null,t0:0,ph:null};
function stopAnim(){if(anim.raf)cancelAnimationFrame(anim.raf);anim.raf=0;anim.playing=false;}
function frame(now){
  if(!anim.playing||!anim.cfg)return;
  var cfg=anim.cfg,period=cfg.mode==='hold'?4200:(cfg.mode==='neg'?6500:4600);
  var t=((now-anim.t0)%period)/period;
  var ph=phaseOf(t,cfg.mode);
  setBody(anim.body,lerpPose(cfg.A,cfg.B,ph.k));
  if(anim.ph)anim.ph.textContent=cfg.labels[ph.seg];
  anim.raf=requestAnimationFrame(frame);
}

  mkStep({id:'w4',name:'Sentadillas lentas',label:'10 reps',tempo:'sin llegar al fondo',rest:15,grp:'Calentamiento',cues:['Bajá lento sin llegar al fondo.','Peso parejo en ambos pies.']}),
  mkStep({id:'w5',name:'Flexiones contra la pared',label:'8 reps',tempo:'cuerpo en línea',rest:15,grp:'Calentamiento',cues:['Manos en la pared a la altura del pecho.','Cuerpo en línea y bajá controlado.']}),
  mkStep({id:'w6',name:'Colgado suave',type:'time',t:10,label:'10 s',sets:2,tempo:'pies apoyados si hace falta',rest:20,grp:'Calentamiento',cues:['Colgate con los brazos estirados.','Podés apoyar los pies para descargar peso.']})
];}
function coolSteps(main){var endsHang=main.length&&main[main.length-1].id==='hang';var c=[
  mkStep({id:'c1',name:'Colgado pasivo suave',type:'time',t:20,label:'20 s',sets:2,tempo:'hombros relajados',rest:15,grp:'Enfriamiento',cues:['Colgate relajado, sin balancearte.','Soltá si hay hormigueo o dolor.']}),
  mkStep({id:'c2',name:'Estiramiento de pecho en la pared',type:'time',t:30,label:'30 s por lado',sets:4,tempo:'alterná el lado en cada serie',rest:10,grp:'Enfriamiento',cues:['Antebrazo apoyado en la pared a la altura del hombro.','Girá el tronco hacia el lado contrario, sin forzar.','Alterná el lado en cada serie.']}),
  mkStep({id:'c3',name:'Rotaciones de tronco de pie',label:'8 por lado',tempo:'lentas y simétricas',rest:0,grp:'Enfriamiento',cues:['Giros lentos y parejos hacia ambos lados.']})
];return endsHang?c.slice(1):c;}
function mainSteps(d){return buildDay(d).map(function(e){e.grp='Rutina';return e;});}

/* ---------- Motor de la sesión ---------- */
var S={res:{},steps:[],phase:'home',i:0,s:0,t0:0,end:0,total:0,last:null,done:{},day:'A',n:-1,tot:0};
var SHEET=null;
function cur(){return S.steps[S.i];}
function initSession(d){
  var pi=phaseInfo();
  S.day=d;S.n=pi.n;var ms=mainSteps(d);S.steps=warmSteps().concat(ms).concat(coolSteps(ms));S.res={};
  S.i=0;S.s=0;S.phase='home';S.done={};S.last=null;
  S.tot=S.steps.reduce(function(a,e){return a+e.sets;},0);
  var r=state.sess;
  if(r&&r.v===4&&r.day===d&&r.n===pi.n&&r.i<S.steps.length){S.i=r.i;S.s=r.s;S.done=r.done||{};S.res=r.res||{};}
}
function ensureSession(){
  var d=currentDay(),pi=phaseInfo();
  if(!S.steps.length||S.day!==d||S.n!==pi.n)initSession(d);
}
function persistSess(){state.sess={v:4,day:S.day,n:S.n,i:S.i,s:S.s,done:S.done,res:S.res};save();}
function doneCount(){var c=0;for(var k in S.done)if(S.done[k])c++;return c;}
function hasProgress(){return doneCount()>0||S.i>0||S.s>0;}
function groupStart(i){return i===0||S.steps[i].grp!==S.steps[i-1].grp;}
function needsIntro(){return S.s===0&&cur().grp==='Rutina';}
/* Elige la pantalla con que arranca la serie actual */
function enterSet(){
  var e=cur();
  if(needsIntro()){S.phase='intro';}
  else if(e.type==='time'){startPrep();return;}
  else{startWork();return;}
  S.last=null;render();
}
function startWork(){
  S.phase='work';S.t0=Date.now();S.last=null;
  var e=cur();S.total=e.type==='time'?e.t*1000:0;S.end=e.type==='time'?S.t0+S.total:0;
  render();
}
function startPrep(){
  S.phase='prep';S.t0=Date.now();S.total=5000;S.end=S.t0+5000;S.last=null;render();
}
function begin(){audio();lock();confirmTone();if(cur().type==='time')startPrep();else startWork();}
function completeSet(early){
  var e=cur();
  var key=S.i+'-'+S.s,pl=e.type==='time'?e.t:(e.planned||0);
  S.done[key]=true;
  var val=pl;
  if(e.type==='time'&&early)val=Math.max(1,Math.min(pl,Math.round((Date.now()-S.t0)/1000)));
  S.res[key]={v:val,p:pl,n:e.name,s:S.s+1,u:e.type==='time'?'s':'reps'};
  S.lastKey=key;
  var restSec=e.rest;
  if(S.s>=e.sets-1){S.i++;S.s=0;}else{S.s++;}
  persistSess();
  if(S.i>=S.steps.length){finishSession();return;}
  if(restSec<=0){enterSet();return;}
  S.phase='rest';S.t0=Date.now();S.total=restSec*1000;S.end=S.t0+S.total;S.last=null;
  render();
}
function afterRest(silent){if(silent)confirmTone();else horn();enterSet();}
function skipExercise(){
  if(S.phase==='home'||S.phase==='done')return;
  S.i++;S.s=0;persistSess();
  if(S.i>=S.steps.length){finishSession();return;}
  enterSet();
}
function undoSet(){
  if(S.phase==='done'||(S.i===0&&S.s===0))return;
  if(S.s>0){S.s--;}else{S.i--;S.s=S.steps[S.i].sets-1;}
  delete S.done[S.i+'-'+S.s];delete S.res[S.i+'-'+S.s];persistSess();
  enterSet();
}
function finishSession(){
  S.phase='done';unlock();
  tone(523,0.18,0.2);setTimeout(function(){tone(659,0.18,0.2);},200);setTimeout(function(){tone(784,0.35,0.2);},400);
  render();
}
function tapBig(){
  audio();
  if(S.phase==='ready'){confirmTone();startPrep();return;}
  if(S.phase==='work'){confirmTone();completeSet(true);}
}
setInterval(function(){
  var timed=S.phase==='work'&&cur()&&cur().type==='time';
  if(S.phase==='rest'||S.phase==='prep'||timed){
    var left=Math.max(0,Math.ceil((S.end-Date.now())/1000));
    if(left!==S.last){
      S.last=left;
      if(left===0){
        if(S.phase==='rest'){afterRest(false);}
        else if(S.phase==='prep'){goBeep();startWork();}
        else{horn();completeSet();}
        return;
      }
      if(left<=5){warn(left);}
      else if(S.phase==='rest'){if(state.pips==='sec')tick();else if(state.pips==='5s'&&left%5===0)tick();}
    }
  }
  updateClock();
},100);
function mmss(sec){var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}
function updateClock(){
  var c=$('#clock'),r=$('#ring');if(!c||!r)return;
  var now=Date.now(),frac=1,txt='';
  if(S.phase==='rest'||S.phase==='prep'||(S.phase==='work'&&S.end)){
    var ms=Math.max(0,S.end-now);txt=mmss(Math.ceil(ms/1000));frac=S.total?ms/S.total:0;
  }else if(S.phase==='work'){txt=mmss(Math.floor((now-S.t0)/1000));frac=1;}
  else if(S.phase==='ready'){txt=mmss(cur().t);frac=1;}
  c.textContent=txt;
  r.style.strokeDashoffset=String(565.5*(1-frac));
}

/* ---------- Pantallas de la sesión ---------- */
function posInGroup(i){
  var g=S.steps[i].grp,k=0,tot=0;
  S.steps.forEach(function(e,q){if(e.grp===g){tot++;if(q<=i)k++;}});
  return {k:k,tot:tot,g:g};
}

function render(){
  var v=state.tab,html,fixed=false,app=$('#app');
  if(!SHEET)stopAnim();
  if(v==='hoy'){
    ensureSession();
    var ph=S.phase;
    if(ph==='home')html=homeHTML();
    else{fixed=true;html=ph==='intro'?introHTML():(ph==='done'?doneScreen():circleScreen());}
  }
  else if(v==='fases')html=fasesView();
  else if(v==='test')html=testView();
  else html=regView();
  var st=$('#stage');
  st.className='screen'+(fixed?' fixed':'');
  st.innerHTML=html;
  app.classList.toggle('insess',fixed);
  renderTabs();
  if(v==='hoy'&&S.phase==='intro'&&cur().fig&&!SHEET)setupFigure(cur().fig,st);
  if(deferred&&$('#installBtn'))$('#installBtn').hidden=false;
  updateClock();
  save();
}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){state.tab=b.dataset.tab;render();var st=$('#stage');if(st)st.scrollTop=0;return;}
  var act=b.dataset.act;
  if(act==='start'){audio();ensureSession();lock();enterSet();return;}
  if(act==='go'){begin();return;}
  if(act==='big'){tapBig();return;}
  if(act==='day'){state.day=b.dataset.d;state.sess=null;S.steps=[];render();return;}
  if(act==='adj'){var rr=S.res[S.lastKey];if(rr){var st=rr.u==='s'?5:1;rr.v=Math.max(0,rr.v+parseInt(b.dataset.d,10)*st);persistSess();var av=$('#adjv');if(av)av.textContent=rr.v;}return;}
  if(act==='plus30'){if(S.phase==='rest'){S.end+=30000;S.total+=30000;S.last=null;}return;}
  if(act==='skiprest'){if(S.phase==='rest')afterRest(true);return;}
  if(act==='menu'){openSheet('menu');return;}
  if(act==='tech'){openSheet('tech');return;}
  if(act==='sound'){openSheet('sound');return;}
  if(act==='closesheet'){closeSheet();return;}
  if(act==='skipex'){closeSheet();skipExercise();return;}
  if(act==='undo'){closeSheet();undoSet();return;}
  if(act==='endnow'){closeSheet();finishSession();return;}
  if(act==='exit'){closeSheet();S.phase='home';unlock();persistSess();render();return;}
  if(act==='restart'){state.sess=null;S.steps=[];state.pain={};render();return;}
  if(act==='demo'){demoSound();return;}
  if(act==='pain'){state.pain[S.day]=parseInt(b.dataset.v,10);save();var pe=document.querySelector('.pain');if(pe)pe.outerHTML=painHTML(S.day);return;}
  if(act==='finish'){
    var pi=phaseInfo(),p=state.pain[S.day];
    var adj=[];for(var rk in S.res){var q=S.res[rk];if(q.p>0&&q.v!==q.p)adj.push(q.n+' s'+q.s+': '+q.v+'/'+q.p+(q.u==='s'?' s':''));}
    state.log.push({t:Date.now(),k:S.day,ph:PHASES[pi.ph].name,done:doneCount(),tot:S.tot,pain:p===undefined?null:p,adj:adj});
    state.sess=null;state.pain={};state.day=null;S.steps=[];save();unlock();
    state.tab='reg';render();return;
  }
  if(act==='clearlog'){state.log=[];save();render();return;}
  if(act==='starttoday'){state.start=ymdOf(todayUTC());state.sess=null;state.day=null;S.steps=[];state.pain={};save();render();return;}
  if(act==='nextphase'){
    var p2=phaseInfo();state.start=ymdOf(todayUTC()-(p2.n+1)*15*DAY);state.sess=null;S.steps=[];state.pain={};save();render();return;
  }
  if(act==='savetest'){
    var v={},any=false;
    document.querySelectorAll('[data-tf]').forEach(function(inp){if(inp.value!==''){var x=parseFloat(inp.value);if(!isNaN(x)&&x>=0){v[inp.dataset.tf]=x;any=true;}}});
    var m=$('#tmsg');
    if(!any){m.textContent='Cargá al menos una prueba.';return;}
    state.tests.push({t:Date.now(),v:v});save();render();
    var m2=$('#tmsg');if(m2)m2.textContent='Guardado.';return;
  }
  if(b.id==='installBtn'&&deferred){
    deferred.prompt();
    deferred.userChoice.then(function(){deferred=null;b.hidden=true;},function(){});
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='startDate'&&t.value){state.start=t.value;state.sess=null;S.steps=[];save();render();}
  if(t.id==='arms'){state.arms=t.checked;state.sess=null;S.steps=[];save();render();}
  if(t.id==='protect'){state.protect=t.checked;state.sess=null;S.steps=[];save();render();}
  if(t.id==='pips'){state.pips=t.value;save();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='vol'){state.vol=parseFloat(t.value);save();}
});

/* ---------- Instalación y offline ---------- */
var deferred=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;var ib=$('#installBtn');if(ib)ib.hidden=false;});
window.addEventListener('appinstalled',function(){var ib=$('#installBtn');if(ib)ib.hidden=true;});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}

render();
})();
</script>
</body>
</html>
